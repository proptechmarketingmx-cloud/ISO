<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="ISO — Gestión de Usuarios y Roles del Sistema"/>
  <title>Gestión de Usuarios — ISO Plataforma Inmobiliaria</title>
  <link rel="stylesheet" href="/assets/css/estilo.css"/>
  <style>
    .users-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }
    .users-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--c-text-1, #f8fafc);
      margin: 0;
    }
    .users-subtitle {
      font-size: 0.875rem;
      color: var(--c-text-2, #94a3b8);
      margin: 4px 0 0 0;
    }
    .btn-primary {
      background: linear-gradient(135deg, #c9a227, #b08d1e);
      color: #0f172a;
      font-weight: 700;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: transform 0.15s, opacity 0.15s;
    }
    .btn-primary:hover {
      opacity: 0.95;
      transform: translateY(-1px);
    }
    .users-table-container {
      background: var(--c-surface, #1e293b);
      border: 1px solid var(--c-border, rgba(255,255,255,0.08));
      border-radius: 12px;
      overflow: hidden;
    }
    .table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.9rem;
    }
    .table th {
      background: rgba(15, 23, 42, 0.6);
      color: var(--c-text-2, #94a3b8);
      font-weight: 600;
      padding: 14px 20px;
      border-bottom: 1px solid var(--c-border, rgba(255,255,255,0.08));
      text-transform: uppercase;
      font-size: 0.75rem;
      letter-spacing: 0.05em;
    }
    .table td {
      padding: 14px 20px;
      border-bottom: 1px solid var(--c-border, rgba(255,255,255,0.05));
      color: var(--c-text-1, #f8fafc);
    }
    .table tr:last-child td {
      border-bottom: none;
    }
    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: capitalize;
    }
    .badge-admin {
      background: rgba(201, 162, 39, 0.2);
      color: #e6c865;
      border: 1px solid rgba(201, 162, 39, 0.4);
    }
    .badge-asesor {
      background: rgba(59, 130, 246, 0.2);
      color: #60a5fa;
      border: 1px solid rgba(59, 130, 246, 0.4);
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 6px;
    }
    .status-active { background: #10b981; }
    .status-inactive { background: #ef4444; }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal-backdrop.open { display: flex; }
    .modal-card {
      background: var(--c-surface, #1e293b);
      border: 1px solid var(--c-border, rgba(255,255,255,0.1));
      border-radius: 16px;
      width: 100%;
      max-width: 480px;
      padding: 28px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .modal-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--c-text-1);
      margin: 0;
    }
    .modal-close {
      background: none;
      border: none;
      color: var(--c-text-2);
      font-size: 1.5rem;
      cursor: pointer;
    }
    .form-group { margin-bottom: 16px; }
    .form-label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--c-text-2);
      margin-bottom: 6px;
    }
    .form-input, .form-select {
      width: 100%;
      padding: 10px 14px;
      background: var(--c-surface-2, #0f172a);
      border: 1px solid var(--c-border, rgba(255,255,255,0.1));
      border-radius: 8px;
      color: #fff;
      font-size: 0.9rem;
      box-sizing: border-box;
    }
    .form-input:focus, .form-select:focus {
      outline: none;
      border-color: var(--c-accent, #c9a227);
    }
    .btn-secondary {
      background: rgba(255,255,255,0.08);
      color: var(--c-text-1);
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }
    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 24px;
    }
    .action-btn {
      background: none;
      border: none;
      color: var(--c-text-2);
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 4px;
      transition: background 0.15s, color 0.15s;
    }
    .action-btn:hover {
      background: rgba(255,255,255,0.1);
      color: #fff;
    }
  </style>
</head>
<body>

<div class="app-layout" id="app">

  <div class="main-content">
    <header class="topbar">
      <div class="topbar-left">
        <span class="topbar-title">Administración</span>
        <span class="topbar-subtitle">Usuarios y Permisos</span>
      </div>
    </header>

    <main class="page-content" style="padding: 24px;">
      <div class="users-header">
        <div>
          <h1 class="users-title">Usuarios del Sistema</h1>
          <p class="users-subtitle">Gestiona las cuentas de acceso y asignación de roles (Admin / Asesor)</p>
        </div>
        <button class="btn-primary" id="btn-new-user">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Nuevo Usuario
        </button>
      </div>

      <div id="error-alert" style="display:none; background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.3); color: #ef4444; padding: 12px; border-radius: 8px; margin-bottom: 20px;"></div>

      <div class="users-table-container">
        <table class="table">
          <thead>
            <tr>
              <th>Usuario</th>
              <th>Correo Electrónico</th>
              <th>Rol Asignado</th>
              <th>Estado</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="users-table-body">
            <tr>
              <td colspan="5" style="text-align: center; color: var(--c-text-2); padding: 30px;">Cargando usuarios...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>
</div>

<!-- Modal para Crear/Editar Usuario -->
<div class="modal-backdrop" id="user-modal">
  <div class="modal-card">
    <div class="modal-header">
      <h3 class="modal-title" id="modal-title">Crear Nuevo Usuario</h3>
      <button class="modal-close" id="modal-close">&times;</button>
    </div>

    <form id="user-form">
      <input type="hidden" id="user-id"/>
      <div class="form-group">
        <label class="form-label" for="user-nombre">Nombre Completo</label>
        <input type="text" id="user-nombre" class="form-input" placeholder="Ej. Juan Pérez" required/>
      </div>
      <div class="form-group">
        <label class="form-label" for="user-email">Correo Electrónico</label>
        <input type="email" id="user-email" class="form-input" placeholder="juan@agencia.com" required/>
      </div>
      <div class="form-group" id="group-password">
        <label class="form-label" for="user-password">Contraseña</label>
        <input type="password" id="user-password" class="form-input" placeholder="••••••••"/>
      </div>
      <div class="form-group">
        <label class="form-label" for="user-rol">Rol en la Agencia</label>
        <select id="user-rol" class="form-select" required>
          <option value="">Selecciona un rol...</option>
        </select>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn-secondary" id="modal-cancel">Cancelar</button>
        <button type="submit" class="btn-primary" id="modal-submit">Guardar Usuario</button>
      </div>
    </form>
  </div>
</div>

<script type="module">
import '/assets/js/auth-guard.js';
import { auth, SYSTEM_ROLES } from '/assets/js/auth.js';
import { api } from '/assets/js/api.js';

const modal = document.getElementById('user-modal');
const form = document.getElementById('user-form');
const tableBody = document.getElementById('users-table-body');
const errorAlert = document.getElementById('error-alert');

let cachedRoles = [];

// Inicialización
async function init() {
  if (!auth.hasPermission('usuarios', 'leer')) {
    alert('No tienes permisos de administrador para acceder a este módulo.');
    window.location.href = '/dashboard/';
    return;
  }
  await Promise.all([loadRoles(), loadUsers()]);
}

async function loadRoles() {
  try {
    cachedRoles = await api.get('/roles');
    const select = document.getElementById('user-rol');
    select.innerHTML = '<option value="">Selecciona un rol...</option>';
    cachedRoles.forEach(r => {
      select.innerHTML += `<option value="${r.id_rol}">${r.nombre} (${r.slug})</option>`;
    });
  } catch (err) {
    showError('Error al cargar roles: ' + err.message);
  }
}

async function loadUsers() {
  try {
    const users = await api.get('/usuarios');
    renderTable(users);
  } catch (err) {
    showError('Error al cargar usuarios: ' + err.message);
  }
}

function renderTable(users) {
  if (!users || users.length === 0) {
    tableBody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: var(--c-text-2); padding: 30px;">No hay usuarios registrados.</td></tr>`;
    return;
  }

  tableBody.innerHTML = users.map(u => {
    const roleObj = (u.roles || [])[0];
    const roleSlug = roleObj ? roleObj.slug : 'sin-rol';
    const roleName = roleObj ? roleObj.nombre : 'Sin Rol';
    const badgeClass = roleSlug === 'admin' ? 'badge-admin' : 'badge-asesor';

    return `
      <tr>
        <td><strong>${u.nombre || '—'}</strong></td>
        <td>${u.email}</td>
        <td><span class="badge ${badgeClass}">${roleName}</span></td>
        <td>
          <span class="status-dot ${u.activo ? 'status-active' : 'status-inactive'}"></span>
          ${u.activo ? 'Activo' : 'Inactivo'}
        </td>
        <td>
          <button class="action-btn btn-edit" data-id="${u.id_usuario}" title="Editar">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          </button>
          <button class="action-btn btn-toggle" data-id="${u.id_usuario}" data-active="${u.activo}" title="${u.activo ? 'Desactivar' : 'Activar'}">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          </button>
        </td>
      </tr>
    `;
  }).join('');

  // Event Listeners en botones de la tabla
  document.querySelectorAll('.btn-edit').forEach(btn => {
    btn.addEventListener('click', () => editUser(btn.dataset.id, users));
  });

  document.querySelectorAll('.btn-toggle').forEach(btn => {
    btn.addEventListener('click', () => toggleUserStatus(btn.dataset.id, btn.dataset.active === 'true'));
  });
}

function openModal(isEdit = false) {
  document.getElementById('modal-title').textContent = isEdit ? 'Editar Usuario' : 'Crear Nuevo Usuario';
  document.getElementById('user-password').required = !isEdit;
  modal.classList.add('open');
}

function closeModal() {
  modal.classList.remove('open');
  form.reset();
  document.getElementById('user-id').value = '';
}

document.getElementById('btn-new-user').addEventListener('click', () => openModal(false));
document.getElementById('modal-close').addEventListener('click', closeModal);
document.getElementById('modal-cancel').addEventListener('click', closeModal);

function editUser(userId, users) {
  const user = users.find(u => u.id_usuario == userId);
  if (!user) return;

  document.getElementById('user-id').value = user.id_usuario;
  document.getElementById('user-nombre').value = user.nombre || '';
  document.getElementById('user-email').value = user.email;
  document.getElementById('user-password').value = '';

  const roleObj = (user.roles || [])[0];
  if (roleObj) {
    document.getElementById('user-rol').value = roleObj.id_rol;
  }

  openModal(true);
}

async function toggleUserStatus(userId, currentActive) {
  if (!confirm(`¿Estás seguro de ${currentActive ? 'desactivar' : 'activar'} este usuario?`)) return;
  try {
    await api.put(`/usuarios/${userId}`, { activo: !currentActive });
    await loadUsers();
  } catch (err) {
    showError('Error al cambiar estatus: ' + err.message);
  }
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const userId = document.getElementById('user-id').value;
  const nombre = document.getElementById('user-nombre').value;
  const email = document.getElementById('user-email').value;
  const password = document.getElementById('user-password').value;
  const rolId = parseInt(document.getElementById('user-rol').value);

  try {
    if (userId) {
      // Actualizar
      const payload = { nombre, roles_ids: [rolId] };
      if (password) payload.password = password;
      await api.put(`/usuarios/${userId}`, payload);
    } else {
      // Crear
      await api.post('/usuarios', {
        nombre,
        email,
        password,
        roles_ids: [rolId]
      });
    }

    closeModal();
    await loadUsers();
  } catch (err) {
    showError(err.message);
  }
});

function showError(msg) {
  errorAlert.textContent = msg;
  errorAlert.style.display = 'block';
  setTimeout(() => { errorAlert.style.display = 'none'; }, 5000);
}

init();
</script>
</body>
</html>
