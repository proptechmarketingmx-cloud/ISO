<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CNA Asesores — Comunidades — ISO</title>
  <link rel="stylesheet" href="/assets/css/estilo.css"/>
</head>
<body>
<div class="app-layout" id="app">
  <div class="main-content">
    <header class="topbar">
      <div class="topbar-left">
        <span class="topbar-title">CNA — Comunidades</span>
        <span class="topbar-subtitle">Clusters de clientes relacionados</span>
      </div>
      <div class="topbar-right">
        <select class="select" id="filter-type" style="width:160px">
          <option value="">Todos los tipos</option>
          <option value="FAMILIAR">Familiar</option>
          <option value="PROFESIONAL">Profesional</option>
          <option value="GEOGRAFICA">Geográfica</option>
          <option value="EMPRESARIAL">Empresarial</option>
        </select>
      </div>
    </header>
    <main class="page-inner fade-in">
      <div class="page-header">
        <div class="page-header-left">
          <h1 class="page-header-title">Comunidades</h1>
          <p class="page-header-sub" id="total-label">Cargando...</p>
        </div>
        <div class="page-header-right">
          <div class="tabs" style="background:var(--c-surface-2)">
            <a href="/cna_asesores/" class="tab">Resumen</a>
            <a href="/cna_asesores/network.html" class="tab">Red</a>
            <a href="/cna_asesores/rankings.html" class="tab">Rankings</a>
            <a href="/cna_asesores/communities.html" class="tab active">Comunidades</a>
            <a href="/cna_asesores/influence.html" class="tab">Influence</a>
            <a href="/cna_asesores/provider.html" class="tab">Provider</a>
          </div>
        </div>
      </div>

      <div class="community-grid stagger" id="community-grid">
        <div class="community-card"><div class="skeleton" style="height:140px"></div></div>
        <div class="community-card"><div class="skeleton" style="height:140px"></div></div>
        <div class="community-card"><div class="skeleton" style="height:140px"></div></div>
      </div>
    </main>
  </div>
</div>

<script type="module">
import '/assets/js/nav.js';
import { cnaApi } from '/assets/js/api.js';
import { formatNumber } from '/assets/js/utils.js';

const TYPE_CONFIG = {
  FAMILIAR:    { color:'#60a5fa', bg:'rgba(96,165,250,0.1)', icon:`<svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>` },
  PROFESIONAL: { color:'#22c55e', bg:'rgba(34,197,94,0.1)',  icon:`<svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>` },
  GEOGRAFICA:  { color:'#f59e0b', bg:'rgba(245,158,11,0.1)', icon:`<svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>` },
  EMPRESARIAL: { color:'#c9a227', bg:'rgba(201,162,39,0.1)', icon:`<svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>` },
};

let allCommunities = [];

async function load() {
  try {
    const data = await cnaApi.asesoresCommunities();
    allCommunities = data.communities || [];
    render();
  } catch {
    document.getElementById('community-grid').innerHTML = `<div style="color:var(--c-text-2);padding:20px">Sin conexión con el servidor.</div>`;
  }
}

function render() {
  const filter = document.getElementById('filter-type').value;
  const filtered = filter ? allCommunities.filter(c => c.tipo === filter) : allCommunities;
  document.getElementById('total-label').textContent = `${filtered.length} comunidad${filtered.length !== 1 ? 'es' : ''} detectada${filtered.length !== 1 ? 's' : ''}`;
  const grid = document.getElementById('community-grid');
  if (!filtered.length) {
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1"><p>No hay comunidades detectadas</p></div>`;
    return;
  }
  grid.innerHTML = filtered.map(c => {
    const cfg = TYPE_CONFIG[c.tipo] || { color:'var(--c-text-2)', bg:'var(--c-surface-3)', icon:'' };
    const members = (c.miembros || []).slice(0, 5);
    return `
      <div class="community-card">
        <div class="community-header">
          <div class="community-icon" style="background:${cfg.bg};color:${cfg.color}">${cfg.icon}</div>
          <div>
            <div class="community-name">${c.nombre || `Comunidad ${c.id}`}</div>
            <div class="community-type" style="color:${cfg.color}">${c.tipo} Â· ${c.total_miembros || c.miembros?.length || 0} miembros</div>
          </div>
        </div>
        ${c.descripcion ? `<p style="font-size:var(--ts-xs);color:var(--c-text-2);margin-bottom:8px">${c.descripcion}</p>` : ''}
        <div class="community-members">
          ${members.map(m => `<div class="community-member">${m.nombre} ${m.apellido_paterno||''}</div>`).join('')}
          ${(c.total_miembros||0) > 5 ? `<div style="color:var(--c-text-3);font-size:var(--ts-xs);margin-left:11px">+${(c.total_miembros||0)-5} más...</div>` : ''}
        </div>
      </div>
    `;
  }).join('');
}

document.getElementById('filter-type').addEventListener('change', render);
load();
</script>
</body>
</html>
