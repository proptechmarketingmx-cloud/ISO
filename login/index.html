<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Iniciar Sesión — ISO Plataforma Inmobiliaria</title>
  <link rel="stylesheet" href="/assets/css/estilo.css"/>
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top right, rgba(201, 162, 39, 0.08), transparent 40%),
                  radial-gradient(circle at bottom left, rgba(30, 41, 59, 0.5), transparent 50%),
                  var(--c-bg, #0f172a);
      margin: 0;
      font-family: inherit;
    }
    .login-card {
      width: 100%;
      max-width: 420px;
      padding: 40px;
      background: var(--c-surface, #1e293b);
      border: 1px solid var(--c-border, rgba(255,255,255,0.1));
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      backdrop-filter: blur(10px);
    }
    .login-brand {
      text-align: center;
      margin-bottom: 32px;
    }
    .login-logo {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, #c9a227, #e6c865);
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #0f172a;
      margin-bottom: 12px;
    }
    .login-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--c-text-1, #f8fafc);
      margin: 0 0 4px 0;
    }
    .login-subtitle {
      font-size: 0.875rem;
      color: var(--c-text-2, #94a3b8);
      margin: 0;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--c-text-2, #94a3b8);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .form-input {
      width: 100%;
      padding: 12px 16px;
      background: var(--c-surface-2, #0f172a);
      border: 1px solid var(--c-border, rgba(255,255,255,0.1));
      border-radius: 8px;
      color: #fff;
      font-size: 0.95rem;
      box-sizing: border-box;
      transition: border-color 0.2s;
    }
    .form-input:focus {
      outline: none;
      border-color: var(--c-accent, #c9a227);
    }
    .btn-login {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #c9a227, #b08d1e);
      border: none;
      border-radius: 8px;
      color: #0f172a;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s;
      margin-top: 10px;
    }
    .btn-login:hover {
      opacity: 0.95;
      transform: translateY(-1px);
    }
    .alert-error {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #ef4444;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-bottom: 20px;
      display: none;
    }
  </style>
</head>
<body>

<div class="login-card">
  <div class="login-brand">
    <div class="login-logo">
      <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    </div>
    <h1 class="login-title">ISO Plataforma</h1>
    <p class="login-subtitle">Acceso al Sistema Inmobiliario</p>
  </div>

  <div id="error-box" class="alert-error"></div>

  <form id="login-form">
    <div class="form-group">
      <label class="form-label" for="email">Correo Electrónico</label>
      <input type="email" id="email" class="form-input" placeholder="usuario@agencia.com" required autocomplete="email"/>
    </div>
    <div class="form-group">
      <label class="form-label" for="password">Contraseña</label>
      <input type="password" id="password" class="form-input" placeholder="••••••••" required autocomplete="current-password"/>
    </div>
    <button type="submit" class="btn-login" id="btn-submit">Iniciar Sesión</button>
  </form>
</div>

<script type="module">
import { auth } from '/assets/js/auth.js';

const form = document.getElementById('login-form');
const errorBox = document.getElementById('error-box');
const btnSubmit = document.getElementById('btn-submit');
// Vite (5173) y Nginx (80/443) tienen proxy /api; otros servidores deben
// llamar directamente al backend FastAPI.
const frontendPort = window.location.port || (window.location.protocol === 'https:' ? '443' : '80');
const API_BASE = ['80', '443', '5173'].includes(frontendPort) && window.location.protocol !== 'file:'
  ? '/api'
  : 'http://localhost:8000/api';

// Si ya está autenticado, redirigir a dashboard
if (auth.isAuthenticated()) {
  window.location.href = '/dashboard/';
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errorBox.style.display = 'none';
  btnSubmit.disabled = true;
  btnSubmit.textContent = 'Autenticando...';

  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  try {
    const res = await fetch(`${API_BASE}/auth/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });

    const contentType = res.headers.get('content-type') || '';
    const isJson = contentType.includes('application/json');
    const data = isJson ? await res.json() : null;

    if (!res.ok) {
      let msg = data?.detail || `Error del servidor (HTTP ${res.status})`;
      if (!isJson) {
        msg = `El backend devolvió una respuesta no válida (HTTP ${res.status}). Asegúrate de que el servidor FastAPI esté iniciado en http://localhost:8000`;
      }
      throw new Error(msg);
    }

    if (!data || !data.access_token) {
      throw new Error('Respuesta de autenticación no válida.');
    }

    auth.setToken(data.access_token);

    // Obtener perfil completo con permisos
    const meRes = await fetch(`${API_BASE}/auth/me`, {
      headers: { 'Authorization': `Bearer ${data.access_token}` }
    });
    const meContentType = meRes.headers.get('content-type') || '';
    if (meRes.ok && meContentType.includes('application/json')) {
      const meData = await meRes.json();
      auth.setUser(meData);
    }

    window.location.href = '/dashboard/';

  } catch (err) {
    errorBox.textContent = err.message;
    errorBox.style.display = 'block';
    btnSubmit.disabled = false;
    btnSubmit.textContent = 'Iniciar Sesión';
  }
});
</script>

</body>
</html>
