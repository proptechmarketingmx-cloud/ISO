<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="Gestión de propiedades — ISO Plataforma Inmobiliaria"/>
  <title>Propiedades — ISO</title>
  <link rel="stylesheet" href="/assets/css/estilo.css"/>
</head>
<body>
<div class="app-layout" id="app">

  <div class="main-content">
    <header class="topbar">
      <div class="topbar-left">
        <span class="topbar-title">Propiedades</span>
        <span class="topbar-subtitle">Catálogo de inmuebles</span>
      </div>
      <div class="topbar-right">
        <div class="tabs" style="background:var(--c-surface-2)">
          <span class="tab active" data-view="grid">Grid</span>
          <span class="tab" data-view="tabla">Tabla</span>
        </div>
        <button class="btn btn-primary" id="btn-nuevo">
          <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Nueva Propiedad
        </button>
      </div>
    </header>

    <main class="page-inner fade-in">
      <div class="page-header">
        <div class="page-header-left">
          <h1 class="page-header-title">Propiedades</h1>
          <p class="page-header-sub" id="total-label">Cargando...</p>
        </div>
      </div>

      <!-- Toolbar -->
      <div class="toolbar">
        <div class="toolbar-left">
          <div class="search-wrap" style="max-width:300px;flex:1">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="search" class="input" id="search-input" placeholder="Buscar propiedad…"/>
          </div>
          <select class="select" id="filter-tipo" style="width:150px">
            <option value="">Todos los tipos</option>
            <option value="casa">Casa</option>
            <option value="departamento">Departamento</option>
            <option value="terreno">Terreno</option>
            <option value="local">Local Comercial</option>
            <option value="oficina">Oficina</option>
            <option value="bodega">Bodega</option>
          </select>
          <select class="select" id="filter-operacion" style="width:140px">
            <option value="">Venta / Renta</option>
            <option value="venta">Venta</option>
            <option value="renta">Renta</option>
          </select>
          <select class="select" id="filter-status" style="width:140px">
            <option value="">Todos los status</option>
            <option value="disponible">Disponible</option>
            <option value="reservada">Reservada</option>
            <option value="vendida">Vendida</option>
            <option value="rentada">Rentada</option>
          </select>
        </div>
        <div class="toolbar-right">
          <span class="badge badge-muted" id="count-badge">0</span>
        </div>
      </div>

      <!-- Vista Grid -->
      <div id="view-grid">
        <div class="property-grid stagger" id="property-grid"></div>
      </div>

      <!-- Vista Tabla -->
      <div id="view-tabla" style="display:none">
        <div class="card">
          <div class="table-wrapper">
            <table>
              <thead>
                <tr>
                  <th>#</th><th>Título</th><th>Tipo</th><th>Operación</th>
                  <th>Precio</th><th>Ciudad</th><th>Status</th><th></th>
                </tr>
              </thead>
              <tbody id="tabla-props"></tbody>
            </table>
          </div>
          <div class="card-footer">
            <span class="page-info" id="page-info"></span>
            <div class="pagination" id="pagination"></div>
          </div>
        </div>
      </div>

    </main>
  </div>
</div>

<!-- Modal Propiedad -->
<style>
.modal-tabs {
  display: flex;
  gap: 4px;
  border-bottom: 1px solid var(--c-border);
  padding: 0 16px;
  background: var(--c-surface-2);
  overflow-x: auto;
}
.modal-tab {
  padding: 12px 16px;
  font-size: var(--ts-sm);
  color: var(--c-text-2);
  border-bottom: 2px solid transparent;
  font-weight: 500;
  transition: all var(--t);
  white-space: nowrap;
}
.modal-tab:hover {
  color: var(--c-text);
  background: rgba(255,255,255,0.02);
}
.modal-tab.active {
  color: var(--c-accent);
  border-bottom-color: var(--c-accent);
  background: rgba(201, 162, 39, 0.05);
}
.tab-content {
  display: none;
  padding: 24px;
  max-height: 55vh;
  overflow-y: auto;
}
.tab-content.active {
  display: block;
  animation: fadeIn var(--t) ease;
}
.checkbox-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 12px;
  padding: 10px 0;
}
.checkbox-label {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: var(--ts-sm);
  color: var(--c-text-2);
  cursor: pointer;
}
.checkbox-label input {
  accent-color: var(--c-accent);
}
.form-grid-3 {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
}
.form-grid-4 {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
}
@media (max-width: 768px) {
  .form-grid-3, .form-grid-4 {
    grid-template-columns: 1fr 1fr;
  }
}
.multimedia-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-top: 12px;
}
.multimedia-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 12px;
  background: var(--c-surface-2);
  border: 1px solid var(--c-border);
  border-radius: var(--r-sm);
  font-size: var(--ts-sm);
}
.multimedia-item a {
  max-width: 70%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
</style>

<div class="modal-overlay" id="modal-prop">
  <div class="modal" style="max-width:850px; width:95%">
    <div class="modal-header">
      <span class="modal-title" id="modal-titulo">Nueva Propiedad</span>
      <button class="modal-close" data-close="modal-prop">
        <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    
    <div class="modal-tabs">
      <button type="button" class="modal-tab active" data-tab="tab-general">General</button>
      <button type="button" class="modal-tab" data-tab="tab-ubicacion">Ubicación</button>
      <button type="button" class="modal-tab" data-tab="tab-comercial">Comercial</button>
      <button type="button" class="modal-tab" data-tab="tab-fisica">Física</button>
      <button type="button" class="modal-tab" data-tab="tab-legal">Legal</button>
      <button type="button" class="modal-tab" data-tab="tab-ideal">Perfil Ideal</button>
      <button type="button" class="modal-tab" data-tab="tab-multimedia">Multimedia</button>
      <button type="button" class="modal-tab" data-tab="tab-cna-matches">Clientes Compatibles</button>
    </div>

    <form id="form-prop">
      <!-- TAB: GENERAL -->
      <div class="tab-content active" id="tab-general">
        <div class="form-grid">
          <div class="form-group span-2">
            <label for="f-titulo">Título *</label>
            <input type="text" class="input" id="f-titulo" name="titulo" required placeholder="Ej. Hermosa casa con alberca en Veracruz"/>
          </div>
          <div class="form-group">
            <label for="f-tipo">Tipo de Propiedad *</label>
            <select class="select" id="f-tipo" name="tipo" required></select>
          </div>
          <div class="form-group">
            <label for="f-operacion">Operación *</label>
            <select class="select" id="f-operacion" name="tipo_operacion" required></select>
          </div>
          <div class="form-group">
            <label for="f-status">Estatus *</label>
            <select class="select" id="f-status" name="status" required></select>
          </div>
          <div class="form-group">
            <label for="f-asesor">Asesor Asignado</label>
            <select class="select" id="f-asesor" name="id_asesor"></select>
          </div>
          <div class="form-group">
            <label for="f-propietario-nombre">Nombre Propietario</label>
            <input type="text" class="input" id="f-propietario-nombre" name="propietario_nombre" placeholder="Nombre completo"/>
          </div>
          <div class="form-group">
            <label for="f-propietario-whatsapp">WhatsApp Propietario</label>
            <input type="text" class="input" id="f-propietario-whatsapp" name="propietario_whatsapp" placeholder="+52..."/>
          </div>
          <div class="form-group span-2">
            <label for="f-descripcion">Descripción detallada</label>
            <textarea class="textarea" id="f-descripcion" name="descripcion" placeholder="Describa los atributos de la propiedad..."></textarea>
          </div>
        </div>
      </div>

      <!-- TAB: UBICACION -->
      <div class="tab-content" id="tab-ubicacion">
        <div class="form-grid">
          <div class="form-group">
            <label for="f-pais">País</label>
            <select class="select" id="f-pais" name="pais"></select>
          </div>
          <div class="form-group">
            <label for="f-estado">Estado</label>
            <select class="select" id="f-estado" name="estado"></select>
          </div>
          <div class="form-group">
            <label for="f-municipio">Municipio / Ciudad</label>
            <input type="text" class="input" id="f-municipio" name="municipio" placeholder="Ej. Boca del Río"/>
          </div>
          <div class="form-group">
            <label for="f-ciudad">Ciudad (Alternativo)</label>
            <input type="text" class="input" id="f-ciudad" name="ciudad" placeholder="Ciudad"/>
          </div>
          <div class="form-group">
            <label for="f-colonia">Colonia</label>
            <input type="text" class="input" id="f-colonia" name="colonia" placeholder="Colonia o Sector"/>
          </div>
          <div class="form-group">
            <label for="f-fraccionamiento">Fraccionamiento</label>
            <input type="text" class="input" id="f-fraccionamiento" name="fraccionamiento" placeholder="Nombre del Fraccionamiento"/>
          </div>
          <div class="form-group">
            <label for="f-cp">Código Postal</label>
            <input type="text" class="input" id="f-cp" name="codigo_postal" placeholder="91000"/>
          </div>
        </div>
      </div>

      <!-- TAB: COMERCIAL -->
      <div class="tab-content" id="tab-comercial">
        <div class="form-grid">
          <div class="form-group">
            <label for="f-precio">Precio de Venta / Renta *</label>
            <input type="number" class="input" id="f-precio" name="precio" required placeholder="0" min="0"/>
          </div>
          <div class="form-group">
            <label for="f-comision">Comisión (%)</label>
            <input type="number" class="input" id="f-comision" name="comision" step="0.1" min="0" max="100"/>
          </div>
          <div class="form-group">
            <label for="f-comision-compartida">Comisión Compartida (%)</label>
            <input type="number" class="input" id="f-comision-compartida" name="comision_compartida" step="0.1" min="0" max="100"/>
          </div>
          <div class="form-group">
            <label for="f-fecha-captacion">Fecha de Captación</label>
            <input type="date" class="input" id="f-fecha-captacion" name="fecha_captacion"/>
          </div>
          <div class="form-group">
            <label for="f-fecha-publicacion">Fecha de Publicación</label>
            <input type="date" class="input" id="f-fecha-publicacion" name="fecha_publicacion"/>
          </div>
          <div class="form-group span-2">
            <div style="display:flex; gap:20px; margin-top:28px;">
              <label class="checkbox-label">
                <input type="checkbox" name="precio_negociable"/> Precio Negociable
              </label>
              <label class="checkbox-label">
                <input type="checkbox" name="exclusiva"/> Es una Exclusiva
              </label>
            </div>
          </div>
          <div class="form-group span-2">
            <label>Créditos Aceptados</label>
            <div class="checkbox-grid" id="creditos-aceptados-container"></div>
          </div>
        </div>
      </div>

      <!-- TAB: FISICA -->
      <div class="tab-content" id="tab-fisica">
        <div class="form-grid-3">
          <div class="form-group">
            <label for="f-m2-const">m² Construcción</label>
            <input type="number" class="input" id="f-m2-const" name="m2_construccion"/>
          </div>
          <div class="form-group">
            <label for="f-m2-ter">m² Terreno</label>
            <input type="number" class="input" id="f-m2-ter" name="m2_terreno"/>
          </div>
          <div class="form-group">
            <label for="f-frente">Frente (m)</label>
            <input type="number" class="input" id="f-frente" name="frente" step="0.1"/>
          </div>
          <div class="form-group">
            <label for="f-fondo">Fondo (m)</label>
            <input type="number" class="input" id="f-fondo" name="fondo" step="0.1"/>
          </div>
          <div class="form-group">
            <label for="f-recamaras">Recámaras (Total)</label>
            <input type="number" class="input" id="f-recamaras" name="recamaras" min="0"/>
          </div>
          <div class="form-group">
            <label for="f-recamaras-pb">Recámaras en PB</label>
            <input type="number" class="input" id="f-recamaras-pb" name="recamaras_pb" min="0"/>
          </div>
          <div class="form-group">
            <label for="f-banos">Baños</label>
            <input type="number" class="input" id="f-banos" name="banos" min="0" step="0.5"/>
          </div>
          <div class="form-group">
            <label for="f-niveles">Niveles / Pisos</label>
            <input type="number" class="input" id="f-niveles" name="niveles" min="1" default="1"/>
          </div>
          <div class="form-group">
            <label for="f-estacionamientos">Estacionamientos</label>
            <input type="number" class="input" id="f-estacionamientos" name="estacionamientos" min="0"/>
          </div>
          <div class="form-group">
            <label for="f-antiguedad">Antigüedad (Años)</label>
            <input type="number" class="input" id="f-antiguedad" name="antiguedad" min="0"/>
          </div>
          <div class="form-group">
            <label for="f-orientacion">Orientación</label>
            <select class="select" id="f-orientacion" name="orientacion"></select>
          </div>
          <div class="form-group">
            <label for="f-conservacion">Estado de Conservación</label>
            <select class="select" id="f-conservacion" name="estado_conservacion"></select>
          </div>
          <div class="form-group">
            <label for="f-anio-const">Año de Construcción</label>
            <input type="number" class="input" id="f-anio-const" name="anio_construccion" min="1900" max="2100"/>
          </div>
          <div class="form-group span-2" style="display:flex; align-items:center; margin-top:24px;">
            <label class="checkbox-label">
              <input type="checkbox" name="remodelada"/> Propiedad Remodelada
            </label>
          </div>
        </div>
      </div>

      <!-- TAB: LEGAL -->
      <div class="tab-content" id="tab-legal">
        <div class="form-grid">
          <div class="form-group">
            <label for="f-regimen">Régimen Legal</label>
            <select class="select" id="f-regimen" name="regimen"></select>
          </div>
          <div class="form-group span-2" style="margin-top: 24px;">
            <div class="checkbox-grid">
              <label class="checkbox-label">
                <input type="checkbox" name="escrituras"/> Tiene Escrituras
              </label>
              <label class="checkbox-label">
                <input type="checkbox" name="libre_gravamen"/> Libre de Gravamen
              </label>
              <label class="checkbox-label">
                <input type="checkbox" name="predial"/> Predial al Corriente
              </label>
              <label class="checkbox-label">
                <input type="checkbox" name="adeudos"/> Cero Adeudos
              </label>
              <label class="checkbox-label">
                <input type="checkbox" name="hipoteca_vigente"/> Hipoteca Vigente
              </label>
              <label class="checkbox-label">
                <input type="checkbox" name="documentacion_completa"/> Documentación Completa
              </label>
            </div>
          </div>
        </div>
      </div>

      <!-- TAB: IDEAL -->
      <div class="tab-content" id="tab-ideal">
        <div class="form-grid">
          <div class="form-group">
            <label for="f-ingreso-rec">Ingreso Recomendado (Auto)</label>
            <input type="number" class="input" id="f-ingreso-rec" name="ingreso_recomendado" readonly style="background:var(--c-surface); color:var(--c-accent); font-weight:600;"/>
          </div>
          <div class="form-group">
            <label for="f-credito-ideal">Crédito Ideal</label>
            <select class="select" id="f-credito-ideal" name="tipo_credito_ideal"></select>
          </div>
          <div class="form-group">
            <label for="f-civil-ideal">Estado Civil Ideal</label>
            <select class="select" id="f-civil-ideal" name="estado_civil_ideal"></select>
          </div>
          <div class="form-group">
            <label for="f-genero-ideal">Género Ideal</label>
            <select class="select" id="f-genero-ideal" name="genero_ideal"></select>
          </div>
          <div class="form-group">
            <label for="f-hijos-ideal">Hijos (Capacidad Máx)</label>
            <input type="number" class="input" id="f-hijos-ideal" name="hijos_ideal" min="0"/>
          </div>
          <div class="form-group">
            <label for="f-mascotas-ideal">Mascotas Permitidas / Ideal</label>
            <input type="number" class="input" id="f-mascotas-ideal" name="mascotas_ideal" min="0"/>
          </div>
          <div class="form-group">
            <label for="f-integrantes-ideal">Integrantes Hogar Recomendados</label>
            <input type="number" class="input" id="f-integrantes-ideal" name="integrantes_ideal" min="0"/>
          </div>
          <div class="form-group">
            <label for="f-uso-suelo">Uso de Suelo</label>
            <select class="select" id="f-uso-suelo" name="uso_suelo"></select>
          </div>
          
          <div class="form-group span-2">
            <label>Ideal Para</label>
            <div class="checkbox-grid" id="ideal-para-container"></div>
          </div>

          <div class="form-group span-2">
            <label>Amenidades</label>
            <div class="checkbox-grid" id="amenidades-container"></div>
          </div>

          <div class="form-group span-2">
            <label>Servicios</label>
            <div class="checkbox-grid" id="servicios-container"></div>
          </div>
        </div>
      </div>

      <!-- TAB: MULTIMEDIA -->
      <div class="tab-content" id="tab-multimedia">
        <p style="color:var(--c-text-2); font-size:var(--ts-sm); margin-bottom:12px;">Ingrese URLs de fotografías, planos o videos para asociar a la propiedad:</p>
        <div style="display:flex; gap:8px;">
          <select class="select" id="f-media-tipo" style="width:140px">
            <option value="foto">Foto</option>
            <option value="video">Video</option>
            <option value="virtual">Tour 3D</option>
            <option value="plano">Plano</option>
            <option value="documento">Documento</option>
          </select>
          <input type="text" class="input" id="f-media-url" placeholder="https://ejemplo.com/archivo.jpg" style="flex:1"/>
          <button type="button" class="btn btn-primary" id="btn-add-media">Agregar</button>
        </div>

        <div class="multimedia-list" id="media-list-container">
          <!-- URLs agregadas aparecerán aquí -->
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-ghost" data-close="modal-prop">Cancelar</button>
        <button type="submit" class="btn btn-primary" id="btn-guardar">
          <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
          Guardar
        </button>
      </div>
    </form>
  </div>
</div>

<!-- Confirm delete -->
<div class="modal-overlay" id="modal-confirm">
  <div class="modal modal-confirm">
    <div class="modal-body" style="text-align:center">
      <div class="modal-confirm-icon"><svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg></div>
      <h2 class="modal-title" style="margin-bottom:8px">Eliminar Propiedad</h2>
      <p class="modal-confirm-text">¿Está seguro de eliminar este registro?</p>
      <p class="modal-confirm-text" style="margin-top:8px;color:var(--c-text-2)">Esta acción no podrá deshacerse.</p>
    </div>
    <div class="modal-footer" style="justify-content:center">
      <button class="btn btn-ghost" data-close="modal-confirm">Cancelar</button>
      <button class="btn btn-danger" id="btn-confirm-delete">Eliminar</button>
    </div>
  </div>
</div>

<script type="module">
import '/assets/js/nav.js';
import { propiedadesApi, asesoresApi } from '/assets/js/api.js';
import { formatCurrency, formatNumber, toast, openModal, closeModal, debounce } from '/assets/js/utils.js';
import { CATALOGOS, llenarSelect } from '/assets/js/catalogos.js';

let allData = [], filtered = [], editId = null, deleteId = null;
let page = 1; const PAGE_SIZE = 12;
let currentView = 'grid';
let tempMultimedia = []; // Guardar multimedia agregado en memoria durante creación/edición

// Inicializar selectores usando el catálogo maestro
llenarSelect('#f-tipo', CATALOGOS.tiposPropiedad);
llenarSelect('#f-operacion', CATALOGOS.operaciones);
llenarSelect('#f-status', CATALOGOS.estatusPropiedad);
llenarSelect('#f-pais', CATALOGOS.paises);
llenarSelect('#f-estado', CATALOGOS.estados);
llenarSelect('#f-orientacion', CATALOGOS.orientaciones);
llenarSelect('#f-conservacion', CATALOGOS.estadosConservacion);
llenarSelect('#f-regimen', CATALOGOS.regimenes);
llenarSelect('#f-credito-ideal', CATALOGOS.tiposCredito);
llenarSelect('#f-civil-ideal', CATALOGOS.estadosCiviles);
llenarSelect('#f-genero-ideal', CATALOGOS.generos);
llenarSelect('#f-uso-suelo', CATALOGOS.usoDeSuelo);

// Cargar catálogo de asesores en el select
async function loadAsesores() {
  try {
    const list = await asesoresApi.list();
    const select = document.getElementById('f-asesor');
    select.innerHTML = '<option value="">Sin Asesor</option>' + list.map(a => `<option value="${a.id_asesor}">${a.nombre} ${a.apellidos}</option>`).join('');
  } catch (err) {
    console.error('Error al cargar asesores:', err);
  }
}
loadAsesores();

// Renderizar checkboxes dinámicos para los catálogos múltiples
function renderCheckboxes(containerId, list, fieldName) {
  const container = document.getElementById(containerId);
  if (!container) return;
  container.innerHTML = list.map(item => `
    <label class="checkbox-label">
      <input type="checkbox" name="${fieldName}" value="${item.value || item}"/>
      ${item.label || item}
    </label>
  `).join('');
}
renderCheckboxes('creditos-aceptados-container', CATALOGOS.tiposCredito, 'creditos_aceptados');
renderCheckboxes('ideal-para-container', CATALOGOS.idealPara, 'ideal_para');
renderCheckboxes('amenidades-container', CATALOGOS.amenidades, 'amenidades');
renderCheckboxes('servicios-container', CATALOGOS.servicios, 'servicios');

// Gestión de pestañas (Tabs)
document.querySelectorAll('.modal-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.modal-tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    
    tab.classList.add('active');
    document.getElementById(tab.dataset.tab).classList.add('active');
  });
});

// Manejo de Multimedia Local (Agregar a la lista)
document.getElementById('btn-add-media').addEventListener('click', () => {
  const tipoEl = document.getElementById('f-media-tipo');
  const urlEl = document.getElementById('f-media-url');
  const tipo = tipoEl.value;
  const url = urlEl.value.trim();
  
  if (!url) {
    toast('Ingrese una URL válida', 'error');
    return;
  }
  
  const mediaObj = { tipo, url, nombre: url.split('/').pop() || 'Archivo' };
  tempMultimedia.push(mediaObj);
  urlEl.value = '';
  renderTempMultimedia();
});

function renderTempMultimedia() {
  const container = document.getElementById('media-list-container');
  container.innerHTML = tempMultimedia.map((m, idx) => `
    <div class="multimedia-item">
      <span><strong>[${m.tipo.toUpperCase()}]</strong> <a href="${m.url}" target="_blank">${m.nombre}</a></span>
      <button type="button" class="btn btn-danger btn-sm" onclick="removeTempMedia(${idx})">Eliminar</button>
    </div>
  `).join('');
}

window.removeTempMedia = (idx) => {
  tempMultimedia.splice(idx, 1);
  renderTempMultimedia();
};

document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => closeModal(b.dataset.close)));

document.querySelectorAll('[data-view]').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('[data-view]').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentView = tab.dataset.view;
    document.getElementById('view-grid').style.display  = currentView==='grid'  ? '' : 'none';
    document.getElementById('view-tabla').style.display = currentView==='tabla' ? '' : 'none';
    currentView==='grid' ? renderGrid() : renderTabla();
  });
});

const STATUS_BADGE = {
  disponible: 'badge-success', reservada: 'badge-warning',
  vendida: 'badge-muted',      rentada: 'badge-info',
};

const TIPO_ICON = `<svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>`;

async function loadPropiedades() {
  try {
    allData = await propiedadesApi.list();
    applyFilters();
  } catch {
    document.getElementById('property-grid').innerHTML = `<p style="color:var(--c-text-2);padding:20px">Sin conexión al servidor.</p>`;
  }
}

function applyFilters() {
  const q   = document.getElementById('search-input').value.toLowerCase();
  const tp  = document.getElementById('filter-tipo').value;
  const op  = document.getElementById('filter-operacion').value;
  const st  = document.getElementById('filter-status').value;
  filtered = allData.filter(p =>
    (!q  || (p.titulo||'').toLowerCase().includes(q) || (p.ciudad||'').toLowerCase().includes(q)) &&
    (!tp || p.tipo === tp) && (!op || p.tipo_operacion === op) && (!st || p.status === st)
  );
  document.getElementById('total-label').textContent = `${filtered.length} propiedad${filtered.length!==1?'es':''}`;
  document.getElementById('count-badge').textContent = `${filtered.length}`;
  page = 1;
  currentView==='grid' ? renderGrid() : renderTabla();
}

function renderGrid() {
  const grid = document.getElementById('property-grid');
  if (!filtered.length) {
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1"><p>No hay propiedades registradas</p></div>`;
    return;
  }
  grid.innerHTML = filtered.slice(0, 48).map(p => `
    <div class="property-card">
      <div class="property-img">${TIPO_ICON}</div>
      <div class="property-body">
        <div class="property-price">${formatCurrency(p.precio)}</div>
        <div class="property-title">${p.titulo || '—'}</div>
        <div style="margin-bottom:10px;display:flex;gap:6px;flex-wrap:wrap">
          <span class="badge badge-muted">${p.tipo||'—'}</span>
          <span class="badge ${STATUS_BADGE[p.status]||'badge-muted'}">${p.status||'—'}</span>
        </div>
        <div class="property-meta">
          ${p.ciudad ? `<span class="property-meta-item"><svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>${p.ciudad}</span>` : ''}
          ${p.m2_construccion ? `<span class="property-meta-item"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>${formatNumber(p.m2_construccion)} m²</span>` : ''}
          ${p.recamaras ? `<span class="property-meta-item"><svg viewBox="0 0 24 24"><path d="M3 9v11"/><path d="M21 9v11"/><path d="M3 12h18"/><rect x="7" y="4" width="10" height="5" rx="1"/></svg>${p.recamaras} rec.</span>` : ''}
        </div>
      </div>
      <div style="padding:0 16px 14px;display:flex;gap:8px">
        <button class="btn btn-ghost btn-sm" style="flex:1" onclick="editProp(${p.id_propiedad})">Editar</button>
        <button class="btn btn-danger btn-sm btn-icon" onclick="confirmDelete(${p.id_propiedad})">
          <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
        </button>
      </div>
    </div>
  `).join('');
}

function renderTabla() {
  const tbody = document.getElementById('tabla-props');
  const total  = filtered.length;
  const pages  = Math.ceil(total / PAGE_SIZE) || 1;
  page = Math.min(page, pages);
  const slice  = filtered.slice((page-1)*PAGE_SIZE, page*PAGE_SIZE);
  if (!slice.length) {
    tbody.innerHTML = `<tr><td colspan="8"><div class="empty-state"><p>Sin propiedades</p></div></td></tr>`;
  } else {
    tbody.innerHTML = slice.map((p, i) => `<tr>
      <td class="muted">${(page-1)*PAGE_SIZE+i+1}</td>
      <td><strong>${p.titulo||'—'}</strong></td>
      <td>${p.tipo||'—'}</td>
      <td class="muted">${p.tipo_operacion||'—'}</td>
      <td><strong style="color:var(--c-accent)">${formatCurrency(p.precio)}</strong></td>
      <td class="muted">${p.ciudad||'—'}</td>
      <td><span class="badge ${STATUS_BADGE[p.status]||'badge-muted'}">${p.status||'—'}</span></td>
      <td><div style="display:flex;gap:6px">
        <button class="btn btn-ghost btn-sm btn-icon" onclick="editProp(${p.id_propiedad})">
          <svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4z"/></svg>
        </button>
        <button class="btn btn-danger btn-sm btn-icon" onclick="confirmDelete(${p.id_propiedad})">
          <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
        </button>
      </div></td>
    </tr>`).join('');
  }
  document.getElementById('page-info').textContent = `Página ${page} de ${pages}`;
  const pag = document.getElementById('pagination');
  pag.innerHTML = `
    <button class="page-btn" onclick="changePage(${page-1})" ${page<=1?'disabled':''}>
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    ${Array.from({length:Math.min(5,pages)},(_,j)=>`<button class="page-btn${j+1===page?' active':''}" onclick="changePage(${j+1})">${j+1}</button>`).join('')}
    <button class="page-btn" onclick="changePage(${page+1})" ${page>=pages?'disabled':''}>
      <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
  `;
}

window.changePage = (p) => { page = p; renderTabla(); };

document.getElementById('btn-nuevo').addEventListener('click', () => {
  editId = null;
  document.getElementById('modal-titulo').textContent = 'Nueva Propiedad';
  document.getElementById('form-prop').reset();
  
  // Limpiar checkboxes
  document.querySelectorAll('#form-prop input[type="checkbox"]').forEach(cb => cb.checked = false);
  tempMultimedia = [];
  renderTempMultimedia();
  
  // Activar primera pestaña
  document.querySelector('.modal-tab[data-tab="tab-general"]').click();
  _cnaMatchesLoaded = false;   // reset lazy flag
  
  openModal('modal-prop');
});

window.editProp = async (id) => {
  const p = allData.find(x => x.id_propiedad === id); if (!p) return;
  editId = id;
  document.getElementById('modal-titulo').textContent = 'Editar Propiedad';
  
  const f = document.getElementById('form-prop');
  f.reset();
  
  // Llenar campos simples
  const simpleFields = [
    'titulo', 'tipo', 'tipo_operacion', 'precio', 'status', 'id_asesor', 'propietario_nombre', 'propietario_whatsapp',
    'pais', 'estado', 'municipio', 'ciudad', 'colonia', 'fraccionamiento', 'codigo_postal',
    'comision', 'comision_compartida', 'fecha_captacion', 'fecha_publicacion',
    'm2_construccion', 'm2_terreno', 'frente', 'fondo', 'recamaras', 'recamaras_pb', 'banos', 'niveles', 'estacionamientos',
    'antiguedad', 'orientacion', 'estado_conservacion', 'anio_construccion',
    'regimen', 'ingreso_recomendado', 'tipo_credito_ideal', 'estado_civil_ideal', 'genero_ideal',
    'hijos_ideal', 'mascotas_ideal', 'integrantes_ideal', 'uso_suelo'
  ];
  
  simpleFields.forEach(k => {
    if (f[k]) {
      f[k].value = p[k] !== undefined && p[k] !== null ? p[k] : '';
    }
  });

  // Llenar booleans (checkboxes)
  const boolFields = [
    'precio_negociable', 'exclusiva', 'remodelada', 'escrituras', 'libre_gravamen', 'predial', 'adeudos', 'hipoteca_vigente', 'documentacion_completa'
  ];
  boolFields.forEach(k => {
    if (f[k]) f[k].checked = !!p[k];
  });

  // Llenar arrays múltiples (checkbox grids)
  const parseAndCheck = (val, inputName) => {
    if (!val) return;
    try {
      const arr = typeof val === 'string' ? JSON.parse(val) : val;
      if (Array.isArray(arr)) {
        arr.forEach(item => {
          const cb = f.querySelector(`input[name="${inputName}"][value="${item}"]`);
          if (cb) cb.checked = true;
        });
      }
    } catch(e) {
      console.warn('Error parsing array field:', inputName, val, e);
    }
  };

  parseAndCheck(p.creditos_aceptados, 'creditos_aceptados');
  parseAndCheck(p.ideal_para, 'ideal_para');
  parseAndCheck(p.amenidades, 'amenidades');
  parseAndCheck(p.servicios, 'servicios');

  // Cargar multimedia de la API
  try {
    tempMultimedia = await propiedadesApi.getMultimedia(id);
  } catch(e) {
    tempMultimedia = [];
  }
  renderTempMultimedia();

  // Activar primera pestaña
  document.querySelector('.modal-tab[data-tab="tab-general"]').click();
  _cnaMatchesLoaded = false;   // reset lazy flag

  openModal('modal-prop');
};

document.getElementById('form-prop').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('btn-guardar'); btn.disabled = true;
  
  const formData = new FormData(e.target);
  const data = Object.fromEntries(formData);

  // Serializar valores vacíos como nulls
  Object.keys(data).forEach(k => { if (data[k] === '') data[k] = null; });

  // Manejar checkboxes booleanos explícitamente
  const boolFields = [
    'precio_negociable', 'exclusiva', 'remodelada', 'escrituras', 'libre_gravamen', 'predial', 'adeudos', 'hipoteca_vigente', 'documentacion_completa'
  ];
  boolFields.forEach(k => {
    data[k] = e.target[k] ? e.target[k].checked : false;
  });

  // Serializar checkbox grids como JSON strings
  const getCheckedValues = (inputName) => {
    const list = [];
    e.target.querySelectorAll(`input[name="${inputName}"]:checked`).forEach(cb => {
      list.push(cb.value);
    });
    return list.length ? JSON.stringify(list) : null;
  };

  data.creditos_aceptados = getCheckedValues('creditos_aceptados');
  data.ideal_para = getCheckedValues('ideal_para');
  data.amenidades = getCheckedValues('amenidades');
  data.servicios = getCheckedValues('servicios');

  try {
    let savedProp;
    if (editId) {
      savedProp = await propiedadesApi.update(editId, data);
      toast('Propiedad actualizada', 'success');
    } else {
      savedProp = await propiedadesApi.create(data);
      toast('Propiedad registrada', 'success');
    }

    // Guardar multimedia
    const propId = editId || savedProp.id_propiedad;
    // Por simplicidad, agregamos los multimedia que no estaban previamente
    const existingMedia = editId ? await propiedadesApi.getMultimedia(propId) : [];
    for (const media of tempMultimedia) {
      if (!existingMedia.some(m => m.url === media.url)) {
        await propiedadesApi.addMultimedia(propId, media);
      }
    }

    closeModal('modal-prop'); 
    await loadPropiedades();
  } catch(err) { 
    toast(`Error: ${err.message}`, 'error'); 
  } finally { 
    btn.disabled = false; 
  }
});

window.confirmDelete = (id) => { deleteId = id; openModal('modal-confirm'); };
document.getElementById('btn-confirm-delete').addEventListener('click', async () => {
  const btn = document.getElementById('btn-confirm-delete');
  if (!deleteId) return;
  btn.disabled = true;
  try {
    await propiedadesApi.remove(deleteId);
    toast('Registro eliminado correctamente.', 'success');
    closeModal('modal-confirm');
    deleteId = null;
    await loadPropiedades();
  } catch(err) { toast(err.message || 'Error al eliminar el registro', 'error'); }
  finally { btn.disabled = false; }
});

document.getElementById('search-input').addEventListener('input', debounce(applyFilters, 300));
['filter-tipo','filter-operacion','filter-status'].forEach(id =>
  document.getElementById(id).addEventListener('change', applyFilters)
);

loadPropiedades();
</script>
</body>
</html>
