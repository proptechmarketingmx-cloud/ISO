<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="Customer Needs Analysis — Análisis comercial y compatibilidad entre clientes y propiedades — ISO Plataforma Inmobiliaria"/>
  <title>Customer Needs Analysis — ISO</title>
  <link rel="stylesheet" href="/assets/css/estilo.css"/>
  <style>
    .score-badge { display:inline-flex;align-items:center;justify-content:center;min-width:52px;padding:3px 10px;border-radius:9999px;font-size:.70rem;font-weight:700;letter-spacing:.04em; }
    .score-excelente { background:rgba(34,197,94,.18);color:#22c55e; }
    .score-alta      { background:rgba(96,165,250,.18);color:#60a5fa; }
    .score-media     { background:rgba(245,158,11,.18);color:#f59e0b; }
    .score-baja      { background:rgba(239,68,68,.18);color:#ef4444; }
    .score-ring-wrap { display:flex;align-items:center;gap:24px;margin-bottom:20px; }
    .score-ring { position:relative;width:96px;height:96px;flex-shrink:0; }
    .score-ring svg { transform:rotate(-90deg); }
    .score-ring-track { fill:none;stroke:var(--c-surface-3);stroke-width:8; }
    .score-ring-fill  { fill:none;stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset .6s cubic-bezier(.4,0,.2,1); }
    .score-ring-label { position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:1rem;font-weight:700;line-height:1.1; }
    .score-ring-label small { font-size:.70rem;color:var(--c-text-2);font-weight:400; }
    .factor-bar { margin-bottom:12px; }
    .factor-bar-header { display:flex;justify-content:space-between;align-items:center;margin-bottom:4px; }
    .factor-bar-label  { font-size:.80rem;color:var(--c-text-2); }
    .factor-bar-val    { font-size:.80rem;font-weight:600; }
    .factor-bar-track  { height:6px;background:var(--c-surface-3);border-radius:9999px;overflow:hidden; }
    .factor-bar-fill   { height:100%;border-radius:9999px;transition:width .5s cubic-bezier(.4,0,.2,1); }
    .match-card { display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;padding:14px 16px;border-radius:10px;background:var(--c-surface-2);border:1px solid var(--c-border);transition:border-color .18s ease,transform .18s ease;cursor:pointer; }
    .match-card:hover { border-color:rgba(201,162,39,.35);transform:translateY(-1px); }
    .match-card-title { font-weight:600;font-size:.80rem;margin-bottom:2px; }
    .match-card-meta  { font-size:.70rem;color:var(--c-text-2); }
    .score-detail-table { width:100%;border-collapse:collapse;font-size:.80rem; }
    .score-detail-table th { text-align:left;padding:8px 12px;background:var(--c-surface-3);color:var(--c-text-2);font-weight:500;font-size:.70rem;text-transform:uppercase;letter-spacing:.06em; }
    .score-detail-table td { padding:10px 12px;border-bottom:1px solid var(--c-border); }
    .score-detail-table tr:last-child td { border-bottom:none; }
    .cna-searcher { background:var(--c-surface);border:1px solid var(--c-border);border-radius:14px;padding:24px;margin-bottom:28px; }
    .cna-searcher-title { font-size:1.125rem;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:10px; }
    .cna-searcher-row { display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap; }
    .cna-searcher-row > * { flex:1;min-width:200px; }
    .cna-searcher-row button { flex:0 0 auto; }
    .top-match-row { display:grid;grid-template-columns:auto 1fr auto auto;gap:12px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--c-border); }
    .top-match-row:last-child { border-bottom:none; }
    .top-match-rank { font-weight:700;font-size:.70rem;color:var(--c-text-3);min-width:20px;text-align:center; }
    .empty-cna { text-align:center;padding:40px 20px;color:var(--c-text-2); }
    .empty-cna svg { width:48px;height:48px;margin:0 auto 12px;opacity:.4; }
    .loading-state { text-align:center;padding:32px;color:var(--c-text-2); }
    @keyframes spin { from{transform:rotate(0deg)}to{transform:rotate(360deg)} }
  </style>
</head>
<body>
<div class="app-layout" id="app">
  <div class="main-content">
    <header class="topbar">
      <div class="topbar-left">
        <span class="topbar-title">Customer Needs Analysis</span>
        <span class="topbar-subtitle">Análisis comercial y compatibilidad cliente ↔ propiedad</span>
      </div>
    </header>
    <main class="page-inner fade-in">
      <div class="page-header">
        <div class="page-header-left">
          <h1 class="page-header-title">Customer Needs Analysis</h1>
          <p class="page-header-sub" id="kpi-subtitle">Cargando indicadores...</p>
        </div>
      </div>
      <div class="kpi-grid stagger" id="kpi-grid">
        <div class="kpi-card"><div class="skeleton" style="height:90px"></div></div>
        <div class="kpi-card"><div class="skeleton" style="height:90px"></div></div>
        <div class="kpi-card"><div class="skeleton" style="height:90px"></div></div>
        <div class="kpi-card"><div class="skeleton" style="height:90px"></div></div>
        <div class="kpi-card"><div class="skeleton" style="height:90px"></div></div>
        <div class="kpi-card"><div class="skeleton" style="height:90px"></div></div>
        <div class="kpi-card"><div class="skeleton" style="height:90px"></div></div>
        <div class="kpi-card"><div class="skeleton" style="height:90px"></div></div>
      </div>
      <div class="cna-searcher">
        <div class="cna-searcher-title">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="var(--c-accent)" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          Consultar compatibilidad
        </div>
        <div class="cna-searcher-row">
          <div>
            <label class="label" style="margin-bottom:6px;display:block">Modo de búsqueda</label>
            <select class="select" id="search-modo" style="width:100%">
              <option value="cliente">Propiedades compatibles con un cliente</option>
              <option value="propiedad">Clientes compatibles con una propiedad</option>
            </select>
          </div>
          <div id="search-cliente-wrap">
            <label class="label" style="margin-bottom:6px;display:block">Seleccionar cliente</label>
            <select class="select" id="search-cliente" style="width:100%"><option value="">— Elige un cliente —</option></select>
          </div>
          <div id="search-propiedad-wrap" style="display:none">
            <label class="label" style="margin-bottom:6px;display:block">Seleccionar propiedad</label>
            <select class="select" id="search-propiedad" style="width:100%"><option value="">— Elige una propiedad —</option></select>
          </div>
          <button class="btn btn-primary" id="btn-buscar" style="height:38px;white-space:nowrap">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
            Analizar
          </button>
        </div>
        <div id="search-results" style="margin-top:20px;display:none"></div>
      </div>
      <div class="grid-2">
        <div class="card fade-in">
          <div class="card-header">
            <span class="card-title">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
              Top Matches
            </span>
            <span class="badge badge-muted" id="top-count">—</span>
          </div>
          <div class="card-body" style="padding:14px"><div id="top-matches-list"><div class="skeleton" style="height:200px"></div></div></div>
        </div>
        <div style="display:flex;flex-direction:column;gap:20px">
          <div class="card fade-in" style="animation-delay:.1s">
            <div class="card-header">
              <span class="card-title">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
                Factores Promedio
              </span>
            </div>
            <div class="card-body" style="padding:20px" id="factores-prom"><div class="skeleton" style="height:140px"></div></div>
          </div>
          <div class="card fade-in" style="animation-delay:.15s">
            <div class="card-header">
              <span class="card-title">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>
                KPIs de Conversión
              </span>
            </div>
            <div class="card-body" style="padding:20px" id="kpis-conversion"><div class="skeleton" style="height:100px"></div></div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
<div class="modal-overlay" id="modal-score">
  <div class="modal" style="max-width:560px">
    <div class="modal-header">
      <h2 class="modal-title" id="modal-score-title">Desglose de Compatibilidad</h2>
      <button class="btn btn-ghost btn-sm" data-close="modal-score">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body" id="modal-score-body"></div>
  </div>
</div>
<script type="module">
import '/assets/js/nav.js';
import { api, kpisApi, matchesApi } from '/assets/js/api.js';
import { formatCurrency, formatNumber } from '/assets/js/utils.js';
function nivelColor(n){const m={excelente:'score-excelente',alta:'score-alta',media:'score-media',baja:'score-baja'};return m[n]||'score-baja';}
function nivelLabel(n){const m={excelente:'Excelente',alta:'Alta',media:'Media',baja:'Baja'};return m[n]||n||'—';}
function scoreColor(s){if(s>=95)return'#22c55e';if(s>=80)return'#60a5fa';if(s>=70)return'#f59e0b';return'#ef4444';}
function buildRing(score,size=96){const r=(size/2)-8;const circ=2*Math.PI*r;const dash=(score/100)*circ;const color=scoreColor(score);return`<div class="score-ring" style="width:${size}px;height:${size}px"><svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle class="score-ring-track" cx="${size/2}" cy="${size/2}" r="${r}"/><circle class="score-ring-fill" cx="${size/2}" cy="${size/2}" r="${r}" stroke="${color}" stroke-dasharray="${dash} ${circ}" stroke-dashoffset="0"/></svg><div class="score-ring-label"><span>${score.toFixed(1)}</span><small>/ 100</small></div></div>`;}
function buildFactorBar(label,peso,val,color){return`<div class="factor-bar"><div class="factor-bar-header"><span class="factor-bar-label">${label}</span><span class="factor-bar-val" style="color:${color}">${val.toFixed(1)}<span style="font-weight:400;color:var(--c-text-3)"> / ${peso}%</span></span></div><div class="factor-bar-track"><div class="factor-bar-fill" style="width:${Math.min(val,100)}%;background:linear-gradient(90deg,${color}99,${color})"></div></div></div>`;}
function renderEmptyState(msg='Sin coincidencias encontradas'){return`<div class="empty-cna"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><line x1="8" y1="12" x2="16" y2="12"/></svg><p>${msg}</p></div>`;}
function renderMatchCards(list,modoP=false){if(!list||!list.length)return renderEmptyState();return list.map((m,i)=>{const title=modoP?(m.nombre_completo||`Cliente #${m.id_cliente}`):(m.titulo||`Propiedad #${m.id_propiedad}`);const sub=modoP?`${m.whatsapp||m.correo||'—'}`:`${m.tipo||'—'} · ${m.ciudad||'—'} · ${m.precio!=null?formatCurrency(m.precio):'—'}`;const target = modoP ? 'cliente' : 'propiedad';const matchId = modoP ? m.id_cliente : m.id_propiedad;return`<div class="match-card" data-open-target="${target}" data-match-id="${matchId}"><div><div class="match-card-title">${title}</div><div class="match-card-meta">${sub}</div></div><div style="display:flex;align-items:center;gap:8px"><span class="score-badge ${nivelColor(m.nivel)}">${(m.score_total||0).toFixed(1)}%</span><button class="btn btn-ghost btn-sm" style="padding:4px 8px;font-size:.70rem" data-desglose="${i}">Desglose</button></div></div>`;}).join('');}
function openScoreModal(title,m){document.getElementById('modal-score-title').textContent=`Desglose: ${title}`;const factores=[{label:'Geográfico',peso:25,val:m.score_geo||0,color:'#60a5fa'},{label:'Económico',peso:30,val:m.score_economico||0,color:'#22c55e'},{label:'Físico',peso:25,val:m.score_fisico||0,color:'#c9a227'},{label:'Familiar',peso:10,val:m.score_familiar||0,color:'#a78bfa'},{label:'Demográfico',peso:10,val:m.score_demo||0,color:'#f472b6'}];document.getElementById('modal-score-body').innerHTML=`<div class="score-ring-wrap" style="padding:8px 0 20px">${buildRing(m.score_total||0,88)}<div><div style="font-size:1.25rem;font-weight:700">${(m.score_total||0).toFixed(1)}%</div><div class="score-badge ${nivelColor(m.nivel)}" style="margin-top:6px">${nivelLabel(m.nivel)}</div><div style="font-size:.70rem;color:var(--c-text-2);margin-top:8px">Compatibilidad calculada</div></div></div><div style="margin-bottom:20px">${factores.map(f=>buildFactorBar(f.label,f.peso,f.val,f.color)).join('')}</div><table class="score-detail-table"><thead><tr><th>Factor</th><th>Peso</th><th>Resultado</th><th>Contribución</th></tr></thead><tbody>${factores.map(f=>`<tr><td>${f.label}</td><td>${f.peso}%</td><td><span style="color:${f.color};font-weight:600">${f.val.toFixed(1)}</span></td><td>${(f.val*f.peso/100).toFixed(1)}</td></tr>`).join('')}<tr style="background:var(--c-surface-3)"><td colspan="3" style="font-weight:700">Score Total</td><td style="font-weight:700;color:${scoreColor(m.score_total||0)}">${(m.score_total||0).toFixed(2)}</td></tr></tbody></table>`;document.getElementById('modal-score').classList.add('open');}
function navigateToMatchCard(card){if(!card)return;const target=card.dataset.openTarget;const matchId=card.dataset.matchId;if(!target||!matchId)return;const url=target==='cliente'?`/clientes/?id_cliente=${matchId}`:`/propiedades/?id_propiedad=${matchId}`;window.location.href=url;}
document.querySelectorAll('[data-close="modal-score"]').forEach(b=>b.addEventListener('click',()=>document.getElementById('modal-score').classList.remove('open')));
document.getElementById('modal-score').addEventListener('click',e=>{if(e.target===e.currentTarget)e.currentTarget.classList.remove('open');});
document.getElementById('search-results').addEventListener('click',e=>{if(e.target.closest('[data-desglose]'))return;const card=e.target.closest('.match-card');if(!card)return;navigateToMatchCard(card);});
async function loadKPIs(){try{const k=await kpisApi.matching();document.getElementById('kpi-subtitle').textContent=`${formatNumber(k.clientes_analizados)} clientes · ${formatNumber(k.propiedades_analizadas)} propiedades analizadas`;document.getElementById('kpi-grid').innerHTML=`<div class="kpi-card" style="--kpi-color:var(--c-accent);--kpi-color-bg:var(--c-accent-muted)"><div class="kpi-top"><div class="kpi-icon"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg></div></div><div class="kpi-value">${formatNumber(k.clientes_analizados)}</div><div class="kpi-label">Clientes analizados</div></div><div class="kpi-card" style="--kpi-color:var(--c-info);--kpi-color-bg:var(--c-info-bg)"><div class="kpi-top"><div class="kpi-icon"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></div></div><div class="kpi-value">${formatNumber(k.propiedades_analizadas)}</div><div class="kpi-label">Propiedades analizadas</div></div><div class="kpi-card" style="--kpi-color:#22c55e;--kpi-color-bg:rgba(34,197,94,.1)"><div class="kpi-top"><div class="kpi-icon"><svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg></div></div><div class="kpi-value">${formatNumber(k.matches_90_plus)}</div><div class="kpi-label">Matches &ge;90%</div></div><div class="kpi-card" style="--kpi-color:var(--c-info);--kpi-color-bg:var(--c-info-bg)"><div class="kpi-top"><div class="kpi-icon"><svg viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg></div></div><div class="kpi-value">${formatNumber(k.matches_80_90)}</div><div class="kpi-label">Matches 80–90%</div></div><div class="kpi-card" style="--kpi-color:var(--c-warn);--kpi-color-bg:var(--c-warn-bg)"><div class="kpi-top"><div class="kpi-icon"><svg viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg></div></div><div class="kpi-value">${formatNumber(k.matches_70_80)}</div><div class="kpi-label">Matches 70–80%</div></div><div class="kpi-card" style="--kpi-color:var(--c-accent);--kpi-color-bg:var(--c-accent-muted)"><div class="kpi-top"><div class="kpi-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg></div></div><div class="kpi-value">${formatNumber(k.clientes_sin_match)}</div><div class="kpi-label">Clientes sin coincidencias</div></div><div class="kpi-card" style="--kpi-color:var(--c-err);--kpi-color-bg:var(--c-err-bg)"><div class="kpi-top"><div class="kpi-icon"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><line x1="9" y1="21" x2="9" y2="12"/><line x1="15" y1="21" x2="15" y2="12"/></svg></div></div><div class="kpi-value">${formatNumber(k.propiedades_sin_match)}</div><div class="kpi-label">Propiedades sin coincidencias</div></div><div class="kpi-card" style="--kpi-color:var(--c-accent);--kpi-color-bg:var(--c-accent-muted)"><div class="kpi-top"><div class="kpi-icon"><svg viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg></div></div><div class="kpi-value">${k.compat_promedio.toFixed(1)}<small style="font-size:.6em;margin-left:2px">%</small></div><div class="kpi-label">Compatibilidad promedio</div></div>`;const facs=[{label:'Geográfico (25%)',val:k.promedio_geo,color:'#60a5fa'},{label:'Económico (30%)',val:k.promedio_economico,color:'#22c55e'},{label:'Físico (25%)',val:k.promedio_fisico,color:'#c9a227'},{label:'Familiar (10%)',val:k.promedio_familiar,color:'#a78bfa'},{label:'Demográfico (10%)',val:k.promedio_demo,color:'#f472b6'}];document.getElementById('factores-prom').innerHTML=facs.map(f=>buildFactorBar(f.label,100,f.val,f.color)).join('');document.getElementById('kpis-conversion').innerHTML=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px"><div><div style="font-size:.70rem;color:var(--c-text-2);margin-bottom:4px">Tasa de conversión</div><div style="font-size:1.25rem;font-weight:700;color:var(--c-ok)">${k.conversion_general.toFixed(1)}%</div></div><div><div style="font-size:.70rem;color:var(--c-text-2);margin-bottom:4px">Tiempo prom. de cierre</div><div style="font-size:1.25rem;font-weight:700;color:var(--c-accent)">${k.tiempo_promedio_cierre}<small style="font-size:.55em;margin-left:3px">días</small></div></div><div><div style="font-size:.70rem;color:var(--c-text-2);margin-bottom:4px">Registros analizados</div><div style="font-size:1.25rem;font-weight:700">${formatNumber(k.total_registros_compat)}</div></div><div><div style="font-size:.70rem;color:var(--c-text-2);margin-bottom:4px">Compatibilidad promedio</div><div style="font-size:1.25rem;font-weight:700;color:var(--c-accent)">${k.compat_promedio.toFixed(1)}%</div></div></div>`;}catch(e){document.getElementById('kpi-grid').innerHTML=`<div style="grid-column:1/-1;padding:20px;color:var(--c-err)">Error al cargar indicadores: ${e.message}</div>`;}}
async function loadTopMatches(){try{const clientes=await api.get('/clientes?limit=5');if(!clientes||!clientes.length){document.getElementById('top-matches-list').innerHTML=renderEmptyState('No hay clientes registrados.');return;}const matches=await matchesApi.clienteMatches(clientes[0].id_cliente,10);document.getElementById('top-count').textContent=`${matches.length} resultados`;if(!matches.length){document.getElementById('top-matches-list').innerHTML=renderEmptyState();return;}document.getElementById('top-matches-list').innerHTML=matches.map((m,i)=>`<div class="top-match-row"><span class="top-match-rank">${i+1}</span><div><div style="font-weight:600;font-size:.80rem">${m.titulo||`Propiedad #${m.id_propiedad}`}</div><div style="font-size:.70rem;color:var(--c-text-2)">${m.tipo||'—'} · ${m.ciudad||'—'}</div></div><span class="score-badge ${nivelColor(m.nivel)}">${(m.score_total||0).toFixed(1)}%</span><button class="btn btn-ghost btn-sm" style="padding:4px 8px;font-size:.70rem" onclick="window._openDesglose(${i})">Ver</button></div>`).join('');window._openDesglose=(idx)=>openScoreModal(matches[idx].titulo||`Propiedad #${matches[idx].id_propiedad}`,matches[idx]);}catch{document.getElementById('top-matches-list').innerHTML=renderEmptyState('No se pudieron cargar los matches.');}}
async function loadSelectores(){try{const[clientes,propiedades]=await Promise.all([api.get('/clientes?limit=200'),api.get('/propiedades?limit=200')]);const selC=document.getElementById('search-cliente');clientes.forEach(c=>{const o=document.createElement('option');o.value=c.id_cliente;o.textContent=`${c.nombre} ${c.apellido_paterno} ${c.apellido_materno||''}`.trim();selC.appendChild(o);});const selP=document.getElementById('search-propiedad');propiedades.forEach(p=>{const o=document.createElement('option');o.value=p.id_propiedad;o.textContent=`${p.titulo} · ${p.ciudad||'—'}`;selP.appendChild(o);});}catch{}}
document.getElementById('search-modo').addEventListener('change',function(){const pw=document.getElementById('search-propiedad-wrap');const cw=document.getElementById('search-cliente-wrap');if(this.value==='propiedad'){pw.style.display='block';cw.style.display='none';}else{pw.style.display='none';cw.style.display='block';}document.getElementById('search-results').style.display='none';});
let _currentResults=[];
document.getElementById('btn-buscar').addEventListener('click',async()=>{const modo=document.getElementById('search-modo').value;const resultsEl=document.getElementById('search-results');resultsEl.style.display='block';resultsEl.innerHTML=`<div class="loading-state"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="var(--c-accent)" stroke-width="2" style="animation:spin 1s linear infinite;margin:0 auto"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg><p style="margin-top:8px">Calculando compatibilidad...</p></div>`;try{if(modo==='cliente'){const id=document.getElementById('search-cliente').value;if(!id){resultsEl.innerHTML=`<p style="color:var(--c-warn);padding:12px">Selecciona un cliente primero.</p>`;return;}const matches=await matchesApi.clienteMatches(id);_currentResults=matches;if(!matches.length){resultsEl.innerHTML=renderEmptyState('Este cliente no tiene propiedades compatibles aún.');return;}resultsEl.innerHTML=`<p style="font-size:.70rem;color:var(--c-text-2);margin-bottom:12px">${matches.length} propiedades compatibles</p><div style="display:flex;flex-direction:column;gap:8px">${renderMatchCards(matches)}</div>`;}else{const id=document.getElementById('search-propiedad').value;if(!id){resultsEl.innerHTML=`<p style="color:var(--c-warn);padding:12px">Selecciona una propiedad primero.</p>`;return;}const matches=await matchesApi.propiedadMatches(id);_currentResults=matches;if(!matches.length){resultsEl.innerHTML=renderEmptyState('Esta propiedad no tiene clientes compatibles aún.');return;}resultsEl.innerHTML=`<p style="font-size:.70rem;color:var(--c-text-2);margin-bottom:12px">${matches.length} clientes compatibles</p><div style="display:flex;flex-direction:column;gap:8px">${renderMatchCards(matches,true)}</div>`;}document.querySelectorAll('[data-desglose]').forEach(btn=>{btn.addEventListener('click',()=>{const idx=parseInt(btn.dataset.desglose);const m=_currentResults[idx];openScoreModal(m.titulo||m.nombre_completo||`Match #${idx+1}`,m);});});}catch(e){resultsEl.innerHTML=`<div style="color:var(--c-err);padding:16px">Error: ${e.message}</div>`;}});
Promise.all([loadKPIs(),loadTopMatches(),loadSelectores()]);
</script>
