<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="Gestión de asesores — ISO Plataforma Inmobiliaria"/>
  <title>Asesores — ISO</title>
  <link rel="stylesheet" href="/assets/css/estilo.css"/>
</head>
<body>
<div class="app-layout" id="app">

  <div class="main-content">
    <header class="topbar">
      <div class="topbar-left">
        <span class="topbar-title">Asesores</span>
        <span class="topbar-subtitle">Equipo de ventas</span>
      </div>
      <div class="topbar-right">
        <button class="btn btn-primary" id="btn-nuevo">
          <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Nuevo Asesor
        </button>
      </div>
    </header>

    <main class="page-inner fade-in">
      <div class="page-header">
        <div class="page-header-left">
          <h1 class="page-header-title">Asesores</h1>
          <p class="page-header-sub" id="total-label">Cargando...</p>
        </div>
      </div>

      <div class="toolbar">
        <div class="toolbar-left">
          <div class="search-wrap" style="max-width:300px; flex:1">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="search" class="input" id="search-input" placeholder="Buscar asesor…"/>
          </div>
          <select class="select" id="filter-status" style="width:150px">
            <option value="">Todos</option>
            <option value="activo">Activo</option>
            <option value="inactivo">Inactivo</option>
          </select>
        </div>
        <div class="toolbar-right">
          <span class="badge badge-muted" id="count-badge">0</span>
        </div>
      </div>

      <div class="card">
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>Nombre</th>
                <th>Teléfono</th>
                <th>Correo</th>
                <th>Especialidad</th>
                <th>Clientes</th>
                <th>Leads</th>
                <th>Status</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="tabla-asesores"></tbody>
          </table>
        </div>
        <div class="card-footer">
          <span class="page-info" id="page-info"></span>
          <div class="pagination" id="pagination"></div>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- Modal Asesor -->
<div class="modal-overlay" id="modal-asesor">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="modal-titulo">Nuevo Asesor</span>
      <button class="modal-close" data-close="modal-asesor">
        <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <form id="form-asesor">
      <div class="modal-body">
        <div class="form-grid">
          <div class="form-group">
            <label for="f-nombre">Nombre *</label>
            <input type="text" class="input" id="f-nombre" name="nombre" required/>
          </div>
          <div class="form-group">
            <label for="f-ap">Apellidos *</label>
            <input type="text" class="input" id="f-ap" name="apellidos" required/>
          </div>
          <div class="form-group">
            <label for="f-tel">Teléfono</label>
            <input type="tel" class="input" id="f-tel" name="telefono"/>
          </div>
          <div class="form-group">
            <label for="f-correo">Correo</label>
            <input type="email" class="input" id="f-correo" name="correo"/>
          </div>
          <div class="form-group">
            <label for="f-esp">Especialidad</label>
            <select class="select" id="f-esp" name="especialidad">
              <option value="">— Sin especificar —</option>
              <option value="residencial">Residencial</option>
              <option value="comercial">Comercial</option>
              <option value="industrial">Industrial</option>
              <option value="terrenos">Terrenos</option>
              <option value="renta">Renta</option>
            </select>
          </div>
          <div class="form-group">
            <label for="f-status">Estatus</label>
            <select class="select" id="f-status" name="status">
              <option value="activo">Activo</option>
              <option value="inactivo">Inactivo</option>
            </select>
          </div>
          <div class="form-group span-2">
            <label for="f-notas">Notas</label>
            <textarea class="textarea" id="f-notas" name="notas" placeholder="Información adicional..."></textarea>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-ghost" data-close="modal-asesor">Cancelar</button>
        <button type="submit" class="btn btn-primary" id="btn-guardar">
          <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
          Guardar
        </button>
      </div>
    </form>
  </div>
</div>

<div class="modal-overlay" id="modal-confirm">
  <div class="modal modal-confirm">
    <div class="modal-body" style="text-align:center">
      <div class="modal-confirm-icon"><svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg></div>
      <h2 class="modal-title" style="margin-bottom:8px">Eliminar Asesor</h2>
      <p class="modal-confirm-text">¿Está seguro de eliminar este registro?</p>
      <p class="modal-confirm-text" style="margin-top:8px;color:var(--c-text-2)">Esta acción no podrá deshacerse.</p>
    </div>
    <div class="modal-footer" style="justify-content:center">
      <button class="btn btn-ghost" data-close="modal-confirm">Cancelar</button>
      <button class="btn btn-danger" id="btn-confirm-delete">Eliminar</button>
    </div>
  </div>
</div>

<script type="module">
import '/assets/js/nav.js';
import { asesoresApi } from '/assets/js/api.js';
import { formatDate, toast, openModal, closeModal, debounce } from '/assets/js/utils.js';

let allData = [], filtered = [], editId = null, deleteId = null;
let page = 1; const PAGE_SIZE = 15;

document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => closeModal(b.dataset.close)));

async function loadAsesores() {
  try {
    allData = await asesoresApi.list();
    applyFilters();
  } catch {
    document.getElementById('tabla-asesores').innerHTML = `<tr><td colspan="9" style="text-align:center;padding:40px;color:var(--c-text-2)">Sin conexión</td></tr>`;
  }
}

function applyFilters() {
  const q  = document.getElementById('search-input').value.toLowerCase();
  const st = document.getElementById('filter-status').value;
  filtered = allData.filter(a => {
    const name = `${a.nombre} ${a.apellidos}`.toLowerCase();
    return (!q || name.includes(q) || (a.correo||'').toLowerCase().includes(q))
        && (!st || a.status === st);
  });
  document.getElementById('total-label').textContent = `${filtered.length} asesor${filtered.length !== 1 ? 'es' : ''}`;
  document.getElementById('count-badge').textContent = `${filtered.length}`;
  page = 1; renderPage();
}

function renderPage() {
  const tbody = document.getElementById('tabla-asesores');
  const total  = filtered.length;
  const pages  = Math.ceil(total / PAGE_SIZE) || 1;
  page = Math.min(page, pages);
  const slice  = filtered.slice((page-1)*PAGE_SIZE, page*PAGE_SIZE);

  if (!slice.length) {
    tbody.innerHTML = `<tr><td colspan="9"><div class="empty-state"><p>No hay asesores registrados</p></div></td></tr>`;
  } else {
    tbody.innerHTML = slice.map((a, i) => `
      <tr>
        <td class="muted">${(page-1)*PAGE_SIZE+i+1}</td>
        <td><strong>${a.nombre} ${a.apellidos||''}</strong></td>
        <td>${a.telefono||'—'}</td>
        <td class="muted">${a.correo||'—'}</td>
        <td>${a.especialidad||'—'}</td>
        <td>${a.total_clientes||0}</td>
        <td>${a.total_leads||0}</td>
        <td><span class="badge ${a.status==='activo'?'badge-success':'badge-muted'}">${a.status||'—'}</span></td>
        <td><div style="display:flex;gap:6px">
          <button class="btn btn-ghost btn-sm btn-icon" onclick="editAsesor(${a.id_asesor})">
            <svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4z"/></svg>
          </button>
          <button class="btn btn-danger btn-sm btn-icon" onclick="confirmDelete(${a.id_asesor})">
            <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
          </button>
        </div></td>
      </tr>
    `).join('');
  }

  document.getElementById('page-info').textContent = `Página ${page} de ${pages}`;
  const pag = document.getElementById('pagination');
  pag.innerHTML = `
    <button class="page-btn" onclick="changePage(${page-1})" ${page<=1?'disabled':''}>
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    ${Array.from({length:Math.min(5,pages)},(_,i)=>`<button class="page-btn${i+1===page?' active':''}" onclick="changePage(${i+1})">${i+1}</button>`).join('')}
    <button class="page-btn" onclick="changePage(${page+1})" ${page>=pages?'disabled':''}>
      <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
  `;
}

window.changePage = (p) => { page = p; renderPage(); };

document.getElementById('btn-nuevo').addEventListener('click', () => {
  editId = null;
  document.getElementById('modal-titulo').textContent = 'Nuevo Asesor';
  document.getElementById('form-asesor').reset();
  openModal('modal-asesor');
});

window.editAsesor = (id) => {
  const a = allData.find(x => x.id_asesor === id); if (!a) return;
  editId = id;
  document.getElementById('modal-titulo').textContent = 'Editar Asesor';
  const f = document.getElementById('form-asesor');
  f.nombre.value      = a.nombre||''; f.apellidos.value  = a.apellidos||'';
  f.telefono.value    = a.telefono||''; f.correo.value   = a.correo||'';
  f.especialidad.value= a.especialidad||''; f.status.value= a.status||'activo';
  f.notas.value       = a.notas||'';
  openModal('modal-asesor');
};

document.getElementById('form-asesor').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('btn-guardar'); btn.disabled = true;
  const data = Object.fromEntries(new FormData(e.target));
  Object.keys(data).forEach(k => { if (data[k]==='') data[k]=null; });
  try {
    editId ? await asesoresApi.update(editId, data) : await asesoresApi.create(data);
    toast(editId ? 'Asesor actualizado' : 'Asesor registrado', 'success');
    closeModal('modal-asesor'); await loadAsesores();
  } catch(err) { toast(`Error: ${err.message}`, 'error'); }
  finally { btn.disabled = false; }
});

window.confirmDelete = (id) => { deleteId = id; openModal('modal-confirm'); };
document.getElementById('btn-confirm-delete').addEventListener('click', async () => {
  const btn = document.getElementById('btn-confirm-delete');
  if (!deleteId) return;
  btn.disabled = true;
  try {
    await asesoresApi.remove(deleteId);
    toast('Registro eliminado correctamente.', 'success');
    closeModal('modal-confirm');
    deleteId = null;
    await loadAsesores();
  } catch(err) { toast(err.message || 'Error al eliminar el registro', 'error'); }
  finally { btn.disabled = false; }
});

document.getElementById('search-input').addEventListener('input', debounce(applyFilters, 300));
document.getElementById('filter-status').addEventListener('change', applyFilters);

loadAsesores();
</script>
</body>
</html>
