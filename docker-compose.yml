services:
  postgres:
    image: postgres:16-alpine
    container_name: iso_postgres_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: iso_p2p
    ports:
      # Exclusivamente para la máquina local (127.0.0.1), no expuesto a internet ni 0.0.0.0
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d iso_p2p"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
