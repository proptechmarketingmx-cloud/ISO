services:

  # ─────────────────────────────────────────────────────────────────
  # P2P SYNC — PostgreSQL (usado por Next.js localmente)
  # Servicio PostgreSQL local para desarrollo.
  # ─────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: iso_postgres_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: iso_p2p
    ports:
      # Exclusivamente para la máquina local (127.0.0.1)
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d iso_p2p"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────────────────────────
  # CRM — MySQL 8 (usado por FastAPI)
  # ─────────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: iso_mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootsecret}
      MYSQL_DATABASE:      ${MYSQL_DATABASE:-iso_db}
      MYSQL_USER:          ${MYSQL_USER:-iso_user}
      MYSQL_PASSWORD:      ${MYSQL_PASSWORD:-isosecret}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootsecret}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─────────────────────────────────────────────────────────────────
  # CRM — FastAPI backend (Python, puerto 8000)
  # El build context es la raíz porque backend/main.py usa
  # imports absolutos como "from backend.database import ..."
  # ─────────────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: iso_backend
    restart: always
    environment:
      DB_DIALECT:    mysql
      DB_HOST:       mysql
      DB_PORT:       "3306"
      DB_NAME:       ${MYSQL_DATABASE:-iso_db}
      DB_USER:       ${MYSQL_USER:-iso_user}
      DB_PASSWORD:   ${MYSQL_PASSWORD:-isosecret}
      CORS_ALLOWED_ORIGINS: "http://localhost:80,http://localhost:5173,http://127.0.0.1,https://iso-silk.vercel.app"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      mysql:
        condition: service_healthy

  # ─────────────────────────────────────────────────────────────────
  # CRM — Nginx frontend (Vite build → dist/, puerto 80)
  # Proxy /api/ → backend:8000
  # ─────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iso_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  mysql_data:
