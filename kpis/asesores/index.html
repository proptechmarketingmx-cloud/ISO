<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>KPIs Asesores — ISO</title>
  <link rel="stylesheet" href="/assets/css/estilo.css"/>
</head>
<body>
<div class="app-layout" id="app">
  <div class="main-content">
    <header class="topbar">
      <div class="topbar-left">
        <span class="topbar-title">KPIs — Asesores</span>
        <span class="topbar-subtitle">Rendimiento del equipo de ventas</span>
      </div>
      <div class="topbar-right">
        <button class="btn btn-secondary" id="btn-refresh">
          <svg viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
          Actualizar
        </button>
      </div>
    </header>
    <main class="page-inner fade-in">
      <div class="page-header">
        <div class="page-header-left">
          <h1 class="page-header-title">KPIs de Asesores</h1>
          <p class="page-header-sub">Desempeño individual y comparativo del equipo</p>
        </div>
        <div class="page-header-right">
          <div class="tabs" style="background:var(--c-surface-2)">
            <a href="/kpis/clientes/" class="tab">Clientes</a>
            <a href="/kpis/propiedades/" class="tab">Propiedades</a>
            <a href="/kpis/asesores/" class="tab active">Asesores</a>
          </div>
        </div>
      </div>

      <div class="kpi-grid stagger" id="kpi-grid">
        <div class="kpi-card"><div class="skeleton" style="height:100px"></div></div>
        <div class="kpi-card"><div class="skeleton" style="height:100px"></div></div>
        <div class="kpi-card"><div class="skeleton" style="height:100px"></div></div>
        <div class="kpi-card"><div class="skeleton" style="height:100px"></div></div>
      </div>

      <div class="card fade-in" style="margin-top:0">
        <div class="card-header">
          <span class="card-title">
            <svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
            Rendimiento por Asesor
          </span>
        </div>
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>Asesor</th>
                <th>Clientes</th>
                <th>Leads</th>
                <th>Leads Cerrados</th>
                <th>Conversión</th>
                <th>Propiedades</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="tabla-asesores"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>

<script type="module">
import '/assets/js/auth-guard.js';
import '/assets/js/nav.js';
import { kpisApi } from '/assets/js/api.js';
import { formatNumber, formatPercent } from '/assets/js/utils.js';

async function load() {
  try {
    const data = await kpisApi.asesores();
    const kpis = [
      { label:'Asesores Activos', value: formatNumber(data.asesores_activos),  color:'var(--c-ok)',     colorBg:'var(--c-ok-bg)',     icon:`<svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>` },
      { label:'Promedio Clientes', value: formatNumber(data.prom_clientes),    color:'var(--c-info)',   colorBg:'var(--c-info-bg)',   icon:`<svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>` },
      { label:'Mejor Conversión',  value: formatPercent(data.mejor_conversion), color:'var(--c-accent)', colorBg:'var(--c-accent-muted)',icon:`<svg viewBox="0 0 24 24"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/></svg>` },
      { label:'Promedio Leads',    value: formatNumber(data.prom_leads),       color:'var(--c-warn)',   colorBg:'var(--c-warn-bg)',   icon:`<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>` },
    ];
    document.getElementById('kpi-grid').innerHTML = kpis.map(k => `
      <div class="kpi-card" style="--kpi-color:${k.color};--kpi-color-bg:${k.colorBg}">
        <div class="kpi-top"><div class="kpi-icon">${k.icon}</div></div>
        <div class="kpi-value">${k.value}</div>
        <div class="kpi-label">${k.label}</div>
      </div>
    `).join('');

    const asesores = data.por_asesor || [];
    document.getElementById('tabla-asesores').innerHTML = asesores.map(a => `
      <tr>
        <td><strong>${a.nombre} ${a.apellidos||''}</strong></td>
        <td>${formatNumber(a.total_clientes||0)}</td>
        <td>${formatNumber(a.total_leads||0)}</td>
        <td>${formatNumber(a.leads_cerrados||0)}</td>
        <td>
          <div style="display:flex;align-items:center;gap:8px">
            <span>${formatPercent(a.conversion||0)}</span>
            <div class="score-bar" style="flex:1;max-width:80px">
              <div class="score-fill" style="width:${Math.min(a.conversion||0,100)}%"></div>
            </div>
          </div>
        </td>
        <td>${formatNumber(a.total_propiedades||0)}</td>
        <td><span class="badge ${a.status==='activo'?'badge-success':'badge-muted'}">${a.status||'—'}</span></td>
      </tr>
    `).join('') || `<tr><td colspan="7" style="text-align:center;color:var(--c-text-2);padding:40px">Sin datos de asesores</td></tr>`;

  } catch {
    document.getElementById('kpi-grid').innerHTML = `<div style="grid-column:1/-1;color:var(--c-text-2);padding:20px">Sin conexión al servidor.</div>`;
  }
}

document.getElementById('btn-refresh').addEventListener('click', load);
load();
</script>
</body>
</html>
